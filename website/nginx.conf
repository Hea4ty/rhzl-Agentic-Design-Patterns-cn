server {
    listen 80;
    server_name rhzk.ruhang365.cn;
    
    # 如果需要 HTTPS，取消下面的注释并配置证书路径
    # listen 443 ssl http2;
    # ssl_certificate /path/to/ssl/fullchain.pem;
    # ssl_certificate_key /path/to/ssl/privkey.pem;
    
    root /var/www/rhzk.ruhang365.cn;
    index index.html;
    
    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/x-javascript application/xml+rss 
               application/javascript application/json image/svg+xml;
    
    # SPA 路由支持（重要！确保所有路由都指向 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # 静态资源缓存策略
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Markdown 文件
    location ~* \.md$ {
        add_header Content-Type "text/markdown; charset=UTF-8";
        expires 1d;
    }
    
    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 日志
    access_log /var/log/nginx/rhzk.ruhang365.cn-access.log;
    error_log /var/log/nginx/rhzk.ruhang365.cn-error.log;
}

